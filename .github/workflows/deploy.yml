name: deploy
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # La aprobación manual del environment va antes de que arranque el job. Su token OIDC
    # lleva sub = repo:<dueño>/<repo>:environment:dev, el único que acepta el rol de despliegue.
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        run: tofu init -input=false

      # Se guarda el plan y se aplica ese mismo archivo: lo que se aplica es exactamente lo
      # que se calculó, aunque el estado cambie entre un paso y otro.
      - name: Plan
        run: tofu plan -var-file=dev.tfvars -input=false -out=tfplan

      - name: Apply
        run: tofu apply -input=false tfplan
