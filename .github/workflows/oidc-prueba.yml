name: oidc-prueba

# Comprueba que los dos roles OIDC se pueden asumir sin secretos de AWS.
# Es temporal: se borra cuando ci.yml y deploy.yml hagan esta comprobación por su cuenta.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/oidc-prueba.yml"

# Sin permisos por defecto; cada job pide lo que necesita.
permissions: {}

jobs:
  rol-de-plan:
    # Corre en el PR: el token trae sub = repo:<dueño>/<repo>:pull_request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity

  rol-de-deploy:
    # Corre a mano y pasa por la aprobación del environment: sub = repo:<dueño>/<repo>:environment:dev
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity
